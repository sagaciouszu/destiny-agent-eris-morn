  </g>

  <!-- Reticle -->
  <g fill="none" stroke="#dc2626">
    <circle cx="980" cy="160" r="90" stroke-width="1" opacity="0.3"/>
    <circle cx="980" cy="160" r="106" stroke-width="0.7" opacity="0.18"/>
  </g>
  <circle cx="890" cy="160" r="2" fill="#dc2626" opacity="0.45"/>
  <circle cx="1070" cy="160" r="2" fill="#dc2626" opacity="0.45"/>

  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#000000" letter-spacing="8">[ WITCH  ·  MOON  ·  VENGEANCE ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#000000" letter-spacing="2">ERIS MORN</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#000000" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#000000" letter-spacing="4">GUARDIAN, YOU ARE NOT ALONE.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#dc2626" letter-spacing="8">[ WITCH  ·  MOON  ·  VENGEANCE ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#f5f5f5" letter-spacing="2">ERIS MORN</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#fca5a5" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#8a8a8a" letter-spacing="4">GUARDIAN, YOU ARE NOT <tspan x="326" fill="#dc2626">ALONE.</tspan></text>
  </g>

  <rect x="60" y="172" width="400" height="1.5" fill="url(#accentfade)"/>

  <text transform="translate(1184, 243) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#dc2626" opacity="0.25">MOON  ·  HELLMOUTH  ·  0.001 AU</text>

  <g fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5">
    <path d="M 24 46 L 24 24 L 46 24"/>
    <path d="M 1176 274 L 1176 296 L 1154 296"/>
  </g>

  <rect width="360" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>
