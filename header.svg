<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Eris Morn - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050303"/>
      <stop offset="50%" stop-color="#0a0505"/>
      <stop offset="100%" stop-color="#120808"/>
    </linearGradient>
    <radialGradient id="redglow" cx="0.85" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="darkglow" cx="0.15" cy="0.5" r="0.35">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="accentfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="overlayfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="38%" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="overlayfade-mask" maskContentUnits="userSpaceOnUse">
      <rect width="1200" height="320" fill="url(#overlayfade)"/>
    </mask>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#redglow)"/>
  <rect width="1200" height="320" fill="url(#darkglow)"/>

  <g stroke="#dc2626" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

